name = "walletlens-push"
main = "index.js"
compatibility_date = "2026-06-21"

# The route the app actually uses.
#
# Every client request used to go to the workers.dev subdomain below. A
# connection check run from the app showed it — and the data worker used as a
# control — failing with "Failed to fetch" on a device that loaded the site
# perfectly, which is what a DNS or ISP blocklist looks like from inside a
# browser. workers.dev is abused for phishing often enough to be on plenty of
# them. Nothing in the app's code could fix that.
#
# walletlens.live is a host the device plainly reaches, and a Worker route wins
# over Pages on a matching path — the same arrangement data-api has used for
# its six datasets since 8551b22f. The prefix is stripped in index.js, so both
# front doors reach identical handlers. Same origin as the page, so CORS, the
# preflight and the origin allowlist all stop being able to break this.
routes = [
  { pattern = "walletlens.live/api/push/*", zone_name = "walletlens.live" },
]

# REQUIRED alongside `routes`: wrangler disables the workers.dev subdomain on
# any deploy that declares routes unless this is set. That is exactly how the
# data worker went dark once already. The subdomain is what deploys and health
# checks use, and it is the fallback if a route is ever misconfigured.
workers_dev = true


# Replaces the Deno Deploy service of the same name, which was suspended when
# the org exhausted its KV Reads allowance. See README.md for why the storage
# moved to D1 and what that changes.

[[d1_databases]]
binding = "DB"
database_name = "walletlens-push"
database_id = "d3e0f37d-bc3e-4525-9007-fd90c6cf35fa"

# The cadences are carried over unchanged from the Deno service. They are set
# by what the OUTBOUND call costs, not by storage: crypto is one batched
# CoinGecko request however many coins are held, so it can run every minute,
# while stocks cost one request per symbol and stay on five.
[triggers]
crons = [
  # Price targets used to have a minute of their own. On Workers Free the CPU
  # ceiling is per invocation, and 1,440 invocations a day of a job that reads
  # every subscription out of D1 and parses it blew that ceiling roughly 1,000
  # times in 24 hours: Cloudflare stops a worker mid-task when it does, so the
  # overrun was not a billing footnote, it was targets and moves being cut off
  # part way through delivering.
  #
  # Folding targets into this pass takes the day from 1,752 invocations to 312.
  # It costs four minutes of latency on an alert, and it costs almost nothing
  # in CPU here: SubStore caches for five minutes, so checkMoves finds the rows
  # checkTargets already loaded and parsed rather than reading D1 again.
  "*/5 * * * *",   # price targets, all-kinds moves, and news
  "5 * * * *",     # hourly: morning brief, win-back ladder, zakat, feature tips
]

# VAPID_SUBJECT is not secret. The two keys are, and are set with
#   wrangler secret put VAPID_PUBLIC_KEY
#   wrangler secret put VAPID_PRIVATE_KEY
#
# They MUST be the same pair the Deno service used. Every existing subscription
# is bound to that public key, and the client's subscriptionMatchesKey() check
# rejects a rotated one — every user would have to re-enable notifications by
# hand.
[vars]
VAPID_SUBJECT = "mailto:contact@walletlens.live"
