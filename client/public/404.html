<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found — WalletLens</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #071a0c; color: #e7eaf0; font-family: system-ui, -apple-system, sans-serif; text-align: center; }
      .wrap { padding: 2rem; max-width: 480px; }
      h1 { font-size: 3rem; margin: 0 0 0.5rem; color: #4ade80; }
      p { line-height: 1.6; color: rgba(255,255,255,0.75); }
      a { color: #4ade80; text-decoration: none; font-weight: 600; }
      a:hover { text-decoration: underline; }
      nav { margin-top: 1.5rem; display: flex; gap: 1.25rem; justify-content: center; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <script>
      // Cloudflare serves this file for any path with no file behind it, which
      // makes it the last place a deep link can still be rescued.
      //
      // /asset/<id> is the one that matters. Every price alert used to point
      // there, and a notification already sitting in someone's tray cannot be
      // rewritten — the URL was baked in when it was sent. Those taps land
      // here, so here is where they get turned into /asset/?id=<id>, which is
      // a real file and does resolve.
      //
      // No loop risk: /asset/ (the shell itself) has nothing after the slash
      // and does not match.
      (function () {
        try {
          var m = location.pathname.match(/^\/asset\/([^/][^?#]*?)\/?$/)
          if (!m) return
          var id = m[1]
          try { id = decodeURIComponent(id) } catch (e) {}
          // Keep whatever the notification appended (utm_source=push and friends).
          var extra = location.search ? '&' + location.search.slice(1) : ''
          location.replace('/asset/?id=' + encodeURIComponent(id) + extra + location.hash)
        } catch (e) {}
      })()
    </script>
    <!-- Visible only without JS — with JS the script above routes into the app -->
    <div class="wrap">
      <h1>404</h1>
      <p>This page doesn't exist — but your portfolio does. The page may have moved, or the address has a typo.</p>
      <nav>
        <a href="/">Home</a>
        <a href="/dashboard/">Dashboard</a>
        <a href="/blog/">Blog</a>
        <a href="/about/">About</a>
      </nav>
    </div>
  </body>
</html>
