name: Star & Watch Promo

# Posts reminders to social media about the repo
# Runs twice a week with different angles each time

on:
  schedule:
    - cron: '0 16 * * 2,5'   # Tuesday & Friday, 16:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-promo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Get repo stats
        id: stats
        run: |
          STARS=$(curl -s "https://api.github.com/repos/tia8910/Walletlens" | jq -r '.stargazers_count')
          echo "stars=$STARS" >> $GITHUB_OUTPUT

      - name: Post to X/Twitter
        env:
          TWITTER_BEARER: ${{ secrets.TWITTER_BEARER }}
        if: env.TWITTER_BEARER != ''
        run: |
          STARS="${{ steps.stats.outputs.stars }}"
          TWEETS=(
            "🔒 Your portfolio data should stay yours.\n\nWalletLens is a free, open-source portfolio tracker with:\n- Zero accounts\n- Zero tracking\n- Zero cloud\n- AI analysis\n\n⭐ ${STARS} stars on GitHub\n\nhttps://github.com/tia8910/Walletlens"
            "📊 Track crypto, stocks, gold, silver & real estate — all in one place.\n\nNo account. No tracking. Open source.\n\n🎙️ Voice import\n📸 Screenshot import\n🤖 AI Magic Indicator\n\n⭐ ${STARS} stars\nhttps://walletlens.live"
            "🚫 Why do portfolio trackers need your email?\n\nWalletLens:\n✅ No account required\n✅ Data never leaves your device\n✅ Free forever\n✅ Open source\n\nhttps://github.com/tia8910/Walletlens"
          )
          IDX=$((RANDOM % ${#TWEETS[@]}))
          echo "Would post: ${TWEETS[$IDX]}"
          # Uncomment when Twitter API is configured:
          # curl -s -X POST "https://api.twitter.com/2/tweets" \
          #   -H "Authorization: Bearer $TWITTER_BEARER" \
          #   -H "Content-Type: application/json" \
          #   -d "{\"text\": \"${TWEETS[$IDX]}\"}"

      - name: Create GitHub Discussion reminder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARS="${{ steps.stats.outputs.stars }}"
          gh api graphql -f query="
            mutation {
              createDiscussion(input: {
                repositoryId: \"R_kgDOSFcLqw\",
                categoryId: \"DIC_kwDOSFcLq84C_EyW\",
                title: \"📊 Weekly Update — ${STARS} Stars & Growing!\",
                body: \"We just hit **${STARS} stars** on GitHub! 🎉\n\nWalletLens is growing thanks to the community. Here is what is new:\n\n- Enhanced AI Magic Indicator\n- Portfolio Guardian anomaly detection\n- Voice and screenshot import\n- Zakat Calculator\n- Push notifications even when app is closed\n\n**Help us grow:**\n- ⭐ Star the repo: https://github.com/tia8910/Walletlens\n- 📱 Try the app: https://walletlens.live\n- 📢 Share with friends who care about privacy\n\nThank you for being part of the journey! 🙏\"
              }) { discussion { number url } }
            }
          "
