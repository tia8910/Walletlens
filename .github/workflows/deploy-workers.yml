name: Deploy Cloudflare Workers

# Deploys the workers that replaced the Deno Deploy services.
#
# This runs in CI rather than from a laptop or a chat session for the same
# reason build-aab.yml does: the credential lives ONLY in GitHub secrets, is
# never pasted anywhere, and the deploy is repeatable by anyone with push
# access instead of living in one person's shell history.
#
# Required secret:
#   CLOUDFLARE_API_TOKEN   Account API token. Create at
#                          dash.cloudflare.com/profile/api-tokens with:
#                            Account · Workers Scripts · Edit
#                            Account · D1 · Edit
#                          Scope it to the one account. Nothing here needs
#                          Zone permissions.
#   CLOUDFLARE_ACCOUNT_ID  From any dashboard URL, or Workers & Pages · right
#                          column.
#
# Per-worker secrets, uploaded to the worker only when the matching GitHub
# secret exists (see the "Upload secrets" steps):
#   voice: ANTHROPIC_API_KEY, RESEND_API_KEY, SIGNUP_EXPORT_TOKEN
#   push:  VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT,
#          FCM_SERVICE_ACCOUNT
#
# The VAPID pair MUST be the one the Deno push service used. A rotated pair is
# rejected by subscriptionMatchesKey(), which silently invalidates every
# existing subscriber and makes each of them re-enable notifications by hand.

on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'Which worker to deploy'
        required: true
        type: choice
        default: voice
        options: [voice, push, both]
      apply_schema:
        description: 'Apply schema.sql to the D1 database first (safe to repeat)'
        required: false
        type: boolean
        default: true

concurrency:
  # Two deploys of the same worker racing each other is never what anyone
  # wanted, and the loser's output is the confusing one.
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      # Deploy sequentially so a failure in the first is not buried under the
      # second's output.
      max-parallel: 1
      fail-fast: false
      matrix:
        worker: ${{ inputs.worker == 'both' && fromJSON('["voice","push"]') || fromJSON(format('["{0}"]', inputs.worker)) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check required secrets are present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings - Secrets and variables - Actions."
            missing=1
          fi
          if [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set."
            missing=1
          fi
          exit $missing

      - name: Refuse to deploy with an unfilled database id
        working-directory: workers/${{ matrix.worker }}
        run: |
          # wrangler's own error for a placeholder id is a generic "database
          # not found", which sends you looking at the dashboard rather than
          # at the file that is actually wrong.
          if grep -q 'REPLACE_WITH_D1_DATABASE_ID' wrangler.toml; then
            echo "::error::workers/${{ matrix.worker }}/wrangler.toml still has the placeholder database_id."
            echo "::error::Create the D1 database, then commit its id. See workers/CUTOVER.md."
            exit 1
          fi

      - name: Apply the database schema
        if: ${{ inputs.apply_schema }}
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Every statement is CREATE ... IF NOT EXISTS, so this is safe to run
          # on a database that is already serving. --remote matters: without it
          # wrangler writes to a local simulation and reports success having
          # changed nothing.
          db=$(grep -m1 '^database_name' wrangler.toml | cut -d'"' -f2)
          echo "Applying schema.sql to $db"
          npx --yes wrangler@4 d1 execute "$db" --remote --yes --file=schema.sql

      - name: Upload voice secrets
        if: ${{ matrix.worker == 'voice' }}
        working-directory: workers/voice
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SIGNUP_EXPORT_TOKEN: ${{ secrets.SIGNUP_EXPORT_TOKEN }}
        run: |
          # A missing secret is a warning, not a failure: the worker still
          # deploys and the features that do not need that key keep working.
          # Silently deploying without them is what would be wrong.
          for name in ANTHROPIC_API_KEY RESEND_API_KEY SIGNUP_EXPORT_TOKEN; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::warning::$name is not set in GitHub secrets; the worker will run without it."
              continue
            fi
            printf '%s' "$value" | npx --yes wrangler@4 secret put "$name"
            echo "set $name"
          done

      - name: Upload push secrets
        if: ${{ matrix.worker == 'push' }}
        working-directory: workers/push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          # Unlike the voice keys, these are not optional: a push worker with
          # no VAPID pair accepts subscriptions and then fails to send to any
          # of them, which looks like a delivery problem rather than a
          # configuration one.
          for name in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set. It must be the SAME pair the Deno service used, or every existing subscriber is silently invalidated."
              exit 1
            fi
            printf '%s' "$value" | npx --yes wrangler@4 secret put "$name"
            echo "set $name"
          done
          if [ -n "$VAPID_SUBJECT" ]; then
            printf '%s' "$VAPID_SUBJECT" | npx --yes wrangler@4 secret put VAPID_SUBJECT
            echo "set VAPID_SUBJECT"
          else
            echo "::warning::VAPID_SUBJECT is not set; the worker falls back to its built-in default."
          fi

          # The FCM service account, for devices in the Android app's own
          # WebView. Optional, unlike the VAPID pair: a deploy without it still
          # serves every browser, desktop and iOS install over Web Push, which
          # is every subscriber that existed before the shell. Warned rather
          # than failed, because failing here would make the push worker
          # undeployable for anyone who has not set Firebase up.
          #
          # Validated as JSON before upload. A truncated paste — easy, it is a
          # long single-line file — would otherwise be stored happily and only
          # surface as every Android notification silently not arriving.
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then
            if ! printf '%s' "$FCM_SERVICE_ACCOUNT" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('project_id') and d.get('client_email') and d.get('private_key')"; then
              echo "::error::FCM_SERVICE_ACCOUNT is not a complete service-account JSON (needs project_id, client_email, private_key). Re-copy the whole file from the Firebase console."
              exit 1
            fi
            printf '%s' "$FCM_SERVICE_ACCOUNT" | npx --yes wrangler@4 secret put FCM_SERVICE_ACCOUNT
            echo "set FCM_SERVICE_ACCOUNT"
          else
            echo "::warning::FCM_SERVICE_ACCOUNT is not set; Android app installs will not receive notifications. Web Push is unaffected."
          fi

      - name: Deploy
        id: deploy
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          # The workers.dev URL is what the client has to be pointed at, so
          # lift it out of the log rather than making someone read the whole
          # thing to find it.
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report the deployed URL
        run: |
          {
            echo "## ${{ matrix.worker }} worker deployed"
            echo
            if [ -n "${{ steps.deploy.outputs.url }}" ]; then
              echo "URL: \`${{ steps.deploy.outputs.url }}\`"
              echo
              echo "Put this in \`client/src/apiHosts.js\`, then run"
              echo "\`cd client && npx vitest run src/apiHosts.test.js\` and do what it says."
              echo "See \`workers/CUTOVER.md\`."
            else
              echo "Deployed, but no workers.dev URL appeared in the output -"
              echo "the worker may be on a custom route instead. Check the dashboard."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
