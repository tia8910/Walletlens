name: Scheduled Discussion Posts

# Posts ONE discussion per day at 14:00 UTC (Sep 3-12 only).
# workflow_dispatch removed — rapid-fire posting caused GitHub account flagging.

on:
  schedule:
    - cron: '0 14 3-12 9 *'

permissions:
  contents: write

concurrency:
  group: discussion-posts
  cancel-in-progress: false

jobs:
  post-discussion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Determine post index
        id: index
        run: |
          STATE_FILE="promo/discussion-state.json"
          if [ -f "$STATE_FILE" ]; then
            IDX=$(jq -r '.next_index' "$STATE_FILE")
          else
            IDX="0"
          fi
          echo "post_index=$IDX" >> $GITHUB_OUTPUT

      - name: Post to GitHub Discussions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IDX="${{ steps.index.outputs.post_index }}"
          STATE_FILE="promo/discussion-state.json"
          POSTS_DIR="promo/discussions"
          mkdir -p promo
          if [ ! -f "$STATE_FILE" ]; then
            echo '{"next_index": 0, "posted": []}' > "$STATE_FILE"
          fi
          POST_FILE="$POSTS_DIR/post-${IDX}.md"
          TITLE_FILE="$POSTS_DIR/post-${IDX}-title.txt"
          CATEGORY_FILE="$POSTS_DIR/post-${IDX}-category.txt"
          if [ ! -f "$POST_FILE" ]; then
            echo "No post for index $IDX — all done."
            exit 0
          fi
          TITLE=$(cat "$TITLE_FILE")
          CATEGORY=$(cat "$CATEGORY_FILE")
          case "$CATEGORY" in
            announcements) CAT_ID="DIC_kwDOSFcLq84C_EyW" ;;
            general) CAT_ID="DIC_kwDOSFcLq84C_EyX" ;;
            ideas) CAT_ID="DIC_kwDOSFcLq84C_EyZ" ;;
            show-and-tell) CAT_ID="DIC_kwDOSFcLq84C_Eya" ;;
            q-a) CAT_ID="DIC_kwDOSFcLq84C_EyY" ;;
            *) CAT_ID="DIC_kwDOSFcLq84C_EyX" ;;
          esac
          BODY=$(cat "$POST_FILE")
          BODY_JSON=$(echo "$BODY" | jq -Rs '.')
          RESULT=$(gh api graphql -f query="
            mutation {
              createDiscussion(input: {
                repositoryId: \"R_kgDOSFcLqw\",
                categoryId: \"$CAT_ID\",
                title: \"$TITLE\",
                body: $BODY_JSON
              }) { discussion { number url } }
            }
          ")
          DISC_URL=$(echo "$RESULT" | jq -r '.data.createDiscussion.discussion.url')
          echo "Posted: $DISC_URL"
          jq --argjson idx "$IDX" '.next_index = ($idx + 1) | .posted += [$idx]' "$STATE_FILE" > "${STATE_FILE}.tmp"
          mv "${STATE_FILE}.tmp" "$STATE_FILE"

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promo/discussion-state.json
          git diff --staged --quiet || git commit -m "chore: discussion post state [skip ci]"
          git push
