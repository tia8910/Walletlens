name: Build Signed AAB & APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.9.1)'
        required: true
        type: string
      version_code:
        description: 'Version code (integer, must be higher than the last Play upload)'
        required: true
        type: number

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # `packages: ''` is the fix, and it has to be here rather than left to
      # the default.
      #
      # setup-android@v3 installs `tools platform-tools` unless told otherwise,
      # and `tools` is the OLD SDK Tools package Google removed from the
      # repository. sdkmanager answers "Failed to find package 'tools'" and
      # exits 1, which fails the step before a single line of our source is
      # compiled. It broke on its own, with no change on our side: run 27 of
      # this workflow passed on 1 September and run 28 failed on 21 September,
      # and in between the only thing that moved was the runner image.
      #
      # Empty means install nothing extra. The runner image already ships
      # platform-tools and the build-tools Gradle asks for, and Gradle resolves
      # anything else it needs through the SDK it is handed.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      # The keystore and its credentials live ONLY in GitHub secrets:
      #   KEYSTORE_BASE64   – base64 of the upload keystore
      #   KEYSTORE_PASSWORD – keystore password
      #   KEY_ALIAS         – key alias
      #   KEY_PASSWORD      – key password
      # There is deliberately no checked-in fallback: a missing secret must
      # fail the build rather than silently sign with a compromised key.
      - name: Decode signing keystore from secret
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Add the upload keystore as a base64 GitHub secret (never commit it)."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > walletlens_source/release_package/signingKey.keystore

      # google-services.json is deliberately gitignored — see .gitignore, which
      # groups it with the keystore under "never commit signing material or
      # Firebase config". It is NOT actually secret (it ships inside every APK
      # and anyone can unzip it back out), but it is not this workflow's place
      # to overrule that, so it arrives the same way the keystore does.
      #
      # Required, not optional. The Google services plugin needs it at
      # configuration time, and app/build.gradle refuses a placeholder — which
      # is the whole point, because a stub config once made FirebaseInitProvider
      # throw at process start, before Application.onCreate, and crashed every
      # launch with "this app has a bug".
      #
      # Passed through env rather than interpolated into the script: the secret
      # is JSON, and pasting it inside quotes is how a stray character ends the
      # string early and writes a truncated file that parses as nothing.
      - name: Write Firebase config from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. Copy the whole of google-services.json from the Firebase console (Project settings > General > Your apps) into a repository secret of that name."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > walletlens_source/release_package/app/google-services.json
          python3 -c "import json; d=json.load(open('walletlens_source/release_package/app/google-services.json')); pkg=d['client'][0]['client_info']['android_client_info']['package_name']; assert pkg=='live.walletlens.twa', 'wrong package: '+pkg; print('firebase config ok:', d['project_info']['project_id'], pkg)"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > walletlens_source/release_package/local.properties

      - name: Update version in build.gradle
        working-directory: walletlens_source/release_package
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.event.inputs.version_code }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ github.event.inputs.version_name }}\"/" app/build.gradle
          echo "Updated to versionCode=${{ github.event.inputs.version_code }}, versionName=${{ github.event.inputs.version_name }}"

      - name: Grant execute permission for gradlew
        working-directory: walletlens_source/release_package
        run: chmod +x gradlew

      - name: Build signed release AAB
        working-directory: walletlens_source/release_package
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/signingKey.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build signed release APK
        working-directory: walletlens_source/release_package
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/signingKey.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # Print the signing certificate's SHA-256 so it can be compared against
      # client/public/.well-known/assetlinks.json. If this fingerprint is not
      # in that file, TWA verification fails for this build: the app shows a
      # URL bar and web notifications are attributed to Chrome instead of the
      # app (notification delegation requires verification).
      - name: Print signing cert SHA-256 (must be in assetlinks.json)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        working-directory: walletlens_source/release_package
        run: |
          echo "── keystore certificate ──"
          keytool -list -v -keystore signingKey.keystore \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" \
            | grep -E "SHA256:|Alias" || true
          echo "── APK signer (authoritative) ──"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -i "SHA-256" || true

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: WalletLens-v${{ github.event.inputs.version_name }}-signed.aab
          path: walletlens_source/release_package/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WalletLens-v${{ github.event.inputs.version_name }}-signed.apk
          path: walletlens_source/release_package/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload ProGuard mapping (for crash debugging)
        uses: actions/upload-artifact@v4
        with:
          name: WalletLens-v${{ github.event.inputs.version_name }}-mapping.txt
          path: walletlens_source/release_package/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
