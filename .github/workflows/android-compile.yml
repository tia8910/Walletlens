name: Compile Android sources

# Catch Java compile errors on the PR, not on the release build.
#
# Build 99 failed at :app:compileReleaseJavaWithJavac on two ordinary mistakes
# — a call with the wrong number of arguments, and a static method calling an
# instance one. Both were in code that had passed 1275 JavaScript tests, been
# reviewed, and been merged, because nothing between writing them and cutting a
# release build had ever asked a Java compiler what it thought.
#
# A release build is a bad place to find that out: it is dispatched by hand,
# takes a version code with it, and the person waiting for it is waiting for an
# APK rather than for a code review. So the compiler runs here instead, on
# every PR that touches the Android project.
#
# Compile only — no keystore, no bundle, no artifacts. The signing secrets stay
# where they are, used by exactly one workflow, and nothing here needs them:
# app/build.gradle has no signingConfig, so the credentials only enter at
# packaging time via -Pandroid.injected.signing.*.

on:
  pull_request:
    paths:
      - 'walletlens_source/release_package/**'
      - '.github/workflows/android-compile.yml'
  workflow_dispatch:

concurrency:
  # A second push to the same PR makes the first run's answer irrelevant.
  group: android-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # `packages: ''` is the fix, and it has to be here rather than left to
      # the default.
      #
      # setup-android@v3 installs `tools platform-tools` unless told otherwise,
      # and `tools` is the OLD SDK Tools package Google removed from the
      # repository. sdkmanager answers "Failed to find package 'tools'" and
      # exits 1, which fails the step before a single line of our source is
      # compiled. It broke on its own, with no change on our side: run 27 of
      # this workflow passed on 1 September and run 28 failed on 21 September,
      # and in between the only thing that moved was the runner image.
      #
      # Empty means install nothing extra. The runner image already ships
      # platform-tools and the build-tools Gradle asks for, and Gradle resolves
      # anything else it needs through the SDK it is handed.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # Same source as build-aab.yml, for the same reason: the file is
      # gitignored, the Google services plugin needs it at CONFIGURATION time,
      # and app/build.gradle refuses a placeholder. Without it this job cannot
      # even evaluate the project, let alone compile it.
      - name: Write Firebase config from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. See build-aab.yml for what it holds."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > walletlens_source/release_package/app/google-services.json

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > walletlens_source/release_package/local.properties

      - name: Compile
        working-directory: walletlens_source/release_package
        run: |
          chmod +x gradlew
          # The release variant specifically: it is the one the release build
          # compiles, and it is the variant R8 then processes.
          ./gradlew --no-daemon :app:compileReleaseJavaWithJavac
