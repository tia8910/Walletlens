name: diag-translate
on:
  push:
    branches: [claude/app-design-nav-update-77mskt]
    paths: ['.github/workflows/diag-translate.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Does the voice worker hold the Anthropic key?
        run: |
          curl -sS -m 30 -X POST https://walletlens-voice.tarek-abdelhameed.workers.dev/ -H 'Content-Type: application/json' -d '{"mode":"vision"}' -w '\nHTTP %{http_code}\n' | head -c 300; echo
          echo "--- GitHub secret present for deploy?"
          if [ -n "$K" ]; then echo "ANTHROPIC_API_KEY secret: set"; else echo "ANTHROPIC_API_KEY secret: MISSING"; fi
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
