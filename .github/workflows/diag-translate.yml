name: diag-translate
on:
  push:
    branches: [claude/app-design-nav-update-77mskt]
    paths: ['.github/workflows/diag-translate.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Call the live translate endpoint
        run: |
          for lang in ar fr; do
            echo "=== $lang"
            curl -sS -m 40 -w '\nHTTP %{http_code} in %{time_total}s\n' -X POST https://walletlens.live/api/translate \
              -H 'Content-Type: application/json' \
              -d "{\"lang\":\"$lang\",\"texts\":[\"Bank group sues U.S. regulator over granting crypto trust charters\",\"Bitcoin climbs as ETF inflows return\"]}"
          done
          echo "=== analyze (same API key)"
          curl -sS -m 40 -o /dev/null -w 'HTTP %{http_code}\n' -X POST https://walletlens.live/api/analyze -H 'Content-Type: application/json' -d '{}'
