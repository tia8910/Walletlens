name: Deploy Web to Cloudflare Pages

# Builds the React client and uploads client/dist to Cloudflare Pages.
#
# THE PROJECT IS 'walletlenslive1', NOT walletlens.
# There are two Pages projects on the account — walletlenslive and
# 'walletlenslive1' — and only 'walletlenslive1' carries the walletlens.live
# custom domain. A deploy to the wrong one SUCCEEDS and changes nothing a
# visitor can see, which is the worst possible failure mode: green tick, stale
# site. The default below is the live one; CLOUDFLARE_PAGES_PROJECT still
# overrides it if the projects are ever renamed.
#
# THIS IS A DIRECT UPLOAD, AND THAT IS MUTUALLY EXCLUSIVE WITH GIT INTEGRATION.
# Cloudflare Pages projects are either Git-connected (Cloudflare clones the
# repo and builds it) or direct-upload (wrangler pushes a built directory).
# 'walletlenslive1' was Git-connected and has been disconnected so this workflow
# can drive it. Reconnecting Git in the Cloudflare dashboard would break this
# workflow, so do one or the other — never both.
#
# THE API TOKEN NEEDS A SCOPE THE WORKERS DEPLOY DOES NOT.
# deploy-workers.yml documents CLOUDFLARE_API_TOKEN as needing
#   Account · Workers Scripts · Edit
#   Account · D1 · Edit
# `wrangler pages deploy` additionally needs
#   Account · Cloudflare Pages · Edit
# The same secret serves both workflows, so the token must carry all three.
# Without the Pages scope this fails at the publish step with a 403 that names
# authentication rather than the missing permission.

on:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Check the Cloudflare secrets are present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          # Checked before the build rather than after it: wrangler-action
          # fails at the very last step, so a missing secret otherwise costs a
          # full npm ci and vite build before saying so.
          missing=0
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. It needs Account · Cloudflare Pages · Edit on top of the Workers and D1 scopes deploy-workers.yml uses."
            missing=1
          fi
          if [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set."
            missing=1
          fi
          if [ -z "$VAPID_PUBLIC" ]; then
            # Not secret — it is the public half and ships inside the JS bundle
            # to every browser. It is checked here because it is BAKED IN AT
            # BUILD TIME: client/src/push.js reads import.meta.env at build, so
            # a build without it produces a site where enabling notifications
            # fails with "Push isn't configured yet (missing key)" and no
            # amount of fixing the push worker helps. That is exactly what
            # shipped, because this workflow never passed the variable at all.
            echo "::error::VAPID_PUBLIC_KEY is not set. Web push cannot work without it: the key is compiled into the bundle, so the site must be REBUILT after setting it. It must also be the same pair walletlens-push holds — a different key invalidates every existing browser subscription."
            missing=1
          fi
          exit $missing

      - name: Install deps
        working-directory: client
        run: npm ci

      - name: Build static site
        working-directory: client
        env:
          CI: false
          # The one variable the bundle cannot get at runtime. Same secret the
          # push worker is deployed with in deploy-workers.yml, so the key the
          # browser subscribes with and the key the sender signs with cannot
          # drift apart.
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Check the build carries its routing files
        working-directory: client
        run: |
          # _redirects holds the SPA fallback (/* /index.html 200); without it
          # every deep link 404s and only the home page works. _headers holds
          # the CSP and cache rules. Both are plain files that live or die with
          # the build, and a deploy missing them looks fine on the home page
          # and is broken everywhere else — so this is worth one grep.
          fail=0
          for f in index.html _redirects _headers; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::dist/$f is missing; the build did not produce a deployable site."
              fail=1
            fi
          done
          grep -q '^/\* /index.html 200' dist/_redirects || {
            echo "::error::dist/_redirects has no SPA fallback rule; deep links would 404."
            fail=1
          }
          exit $fail

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main is what makes this a PRODUCTION deployment. Without
          # it the upload lands as a preview on a random *.pages.dev hostname
          # and the custom domain keeps serving the previous build.
          command: pages deploy client/dist --project-name=walletlenslive1 --branch=main
