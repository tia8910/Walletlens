name: Update Videos

# Links new videos on youtube.com/@walletlens to the Academy, so a video goes
# from upload to the app, the bell and a push with nobody pasting a link.
#
# Reads the channel's public feed (no API key), writes
# client/src/data/academyVideoLinks.js, and when something changed commits it
# to main. Cloudflare Pages' Git integration builds every push to main, this
# one included, so the commit is the deploy. Once the site is live with the
# new list, the push worker picks it up from /academy-videos.json at 16:00
# local time.

on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours, off the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find new videos on the channel
        working-directory: client
        run: node scripts/sync-youtube.mjs

      - name: Commit when something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/src/data/academyVideoLinks.js
          if git diff --staged --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -m "chore: link new Academy videos from YouTube"
          git push
