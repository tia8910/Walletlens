import groovy.xml.MarkupBuilder

plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Refuse to build against a placeholder Firebase config.
//
// THIS EXACT MISTAKE HAS SHIPPED. The app once went out with a stub
// google-services.json and no real Firebase project behind it, which made
// FirebaseInitProvider throw at PROCESS START — before Application.onCreate,
// so nothing could catch it — and every launch died with "this app has a bug".
// See the comment on AnalyticsHelper, which is what is left of that incident.
//
// The Google services plugin only checks the file EXISTS. It cannot tell a
// real project from a convincing placeholder, and the failure it lets through
// is invisible until an actual device starts the process. So the check is
// here: a config whose project id or app id looks like a placeholder fails the
// build, where the cost is a red CI run instead of every install crashing.
def googleServicesFile = file('google-services.json')
if (!googleServicesFile.exists()) {
    throw new GradleException(
        'app/google-services.json is missing. Download it from the Firebase ' +
        'console (Project settings > General > Your apps) — it is not secret ' +
        'and belongs in the repo.')
}
def gs = new groovy.json.JsonSlurper().parseText(googleServicesFile.text)
def gsProject = gs?.project_info?.project_id?.toString() ?: ''
def gsAppId = gs?.client?.getAt(0)?.client_info?.mobilesdk_app_id?.toString() ?: ''
if (!gsProject || gsProject.toLowerCase().contains('placeholder')
        || gsProject.toLowerCase().contains('example')
        || !(gsAppId ==~ /^1:\d+:android:[0-9a-f]+$/)) {
    throw new GradleException(
        "app/google-services.json does not look like a real Firebase project " +
        "(project_id='${gsProject}', mobilesdk_app_id='${gsAppId}'). A stub " +
        "config crashes the app at process start, before any error handling " +
        "can run. Replace it with the file from the Firebase console.")
}

def twaManifest = [
    applicationId: 'live.walletlens.twa',
    hostName: 'walletlens.live', // The domain being opened in the TWA.
    launchUrl: '/dashboard', // The start path for the TWA. Must be relative to the domain.
    name: 'WalletLens net worth tracker', // The application name.
    launcherName: 'WalletLens', // The name shown on the Android Launcher.
    themeColor: '#071A0C', // The color used for the status bar.
    themeColorDark: '#071A0C', // The color used for the dark status bar.
    navigationColor: '#071A0C', // The color used for the navigation bar.
    navigationColorDark: '#071A0C', // The color used for the dark navbar.
    navigationDividerColor: '#071A0C', // The navbar divider color.
    navigationDividerColorDark: '#071A0C', // The dark navbar divider color.
    backgroundColor: '#071A0C', // The color used for the splash screen background.
    enableNotifications: true, // Set to true to enable notification delegation.
    // Every shortcut must include the following fields:
    // - name: String that will show up in the shortcut.
    // - short_name: Shorter string used if |name| is too long.
    // - url: Absolute path of the URL to launch the app with (e.g '/create').
    // - icon: Name of the resource in the drawable folder to use as an icon.
    shortcuts: [[name:'My Portfolio', short_name:'Portfolio', url:'https://walletlens.live/dashboard', icon:'shortcut_0'],[name:'Market Index', short_name:'Markets', url:'https://walletlens.live/market-index', icon:'shortcut_1'],[name:'Fear & Greed Index', short_name:'Fear & Greed', url:'https://walletlens.live/fear-and-greed-index', icon:'shortcut_2']],
    // The duration of fade out animation in milliseconds to be played when removing splash screen.
    splashScreenFadeOutDuration: 300,
    generatorApp: 'PWABuilder', // Application that generated the Android Project
    // The fallback strategy for when Trusted Web Activity is not available. Possible values are
    // 'customtabs' and 'webview'.
    fallbackType: 'customtabs',
    enableSiteSettingsShortcut: 'true',
    // 'any' lets the app follow the device orientation. Android 16 ignores
    // orientation/resizability restrictions on large-screen devices, so locking
    // to portrait no longer works there and only hurts foldables/tablets.
    orientation: 'any',
]


// ── Release signing ─────────────────────────────────────────────────────────
//
// There was no signingConfigs block here at all. A local `./gradlew
// assembleRelease` therefore wrote app-release-UNSIGNED.apk and said nothing
// about it, and an unsigned APK installs nowhere: Softonic's upload check
// rejected one with "we couldn't validate the file's signature", which is how
// the gap was found.
//
// Credentials never enter the repo. They are read from Gradle properties in
// ~/.gradle/gradle.properties, which lives outside the tree where `git add -A`
// cannot reach it, or from the environment:
//
//   WL_KEYSTORE_FILE      absolute path to the keystore
//   WL_KEYSTORE_PASSWORD  keystore password
//   WL_KEY_ALIAS          key alias
//   WL_KEY_PASSWORD       key password
//
// CI does not use any of these. build-aab.yml passes
// -Pandroid.injected.signing.* instead, and AGP applies that over whatever is
// configured here, so the two paths coexist and neither depends on the other.
//
// ── What this key is NOT ────────────────────────────────────────────────────
//
// This is the UPLOAD key. Play App Signing strips it and re-signs with the app
// signing key before distributing, so an APK signed here does not carry the
// same certificate as the WalletLens that is live on Play. Installing one
// beside the other fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE, and the only
// way out is uninstall, which erases localStorage. There are no accounts and
// no server copy, so that is the user's entire portfolio.
//
// So an APK from this build is for testing on your own device. Anything going
// to a third-party store has to be the "Signed, universal APK" from the Play
// Console's app bundle explorer, which carries the app signing key.
def wlKeystoreFile = findProperty('WL_KEYSTORE_FILE') ?: System.getenv('WL_KEYSTORE_FILE')
def wlKeystorePassword = findProperty('WL_KEYSTORE_PASSWORD') ?: System.getenv('WL_KEYSTORE_PASSWORD')
def wlKeyAlias = findProperty('WL_KEY_ALIAS') ?: System.getenv('WL_KEY_ALIAS')
def wlKeyPassword = findProperty('WL_KEY_PASSWORD') ?: System.getenv('WL_KEY_PASSWORD')
def wlHasLocalSigning = wlKeystoreFile && wlKeystorePassword && wlKeyAlias && wlKeyPassword
def wlHasInjectedSigning = project.hasProperty('android.injected.signing.store.file')

android {
    compileSdk 36
    namespace "live.walletlens.twa"
    defaultConfig {
        applicationId "live.walletlens.twa"
        minSdk 23
        targetSdk 36
        // 73 is in production — the code Play accepted at the last upload,
        // read from the Console. Play never accepts a duplicate or a lower
        // code, so 74 is the floor for the next artifact.
        //
        // This value has been wrong before in the way that costs a build: it
        // sat at 41 while the comments further down record v2.7 as 48, so
        // anything built from a clean clone was rejected outright. Nothing
        // else in the repo sets it — there is no bubblewrap twa-manifest.json
        // — so whatever produced 73 did it outside version control, and this
        // line is the only thing keeping the two in step.
        //
        // 74 carries the notification-channel routing: web push now posts on
        // walletlens_alerts / walletlens_quiet rather than a channel
        // androidx.browser invents, which is what decides whether a price
        // alert makes a sound. Native code, so it reaches nobody without a
        // new build. androidRelease.test.js holds this at 74 or above.
        versionCode 102
        // TODO(tarek): unverified. "2" cannot be right next to versionCode 73
        // — this file's own comments track v2.7 and v2.8 — but the real string
        // is not recoverable from the repo. Set it to the version shown for
        // release 73 in the Play Console.
        versionName "7.2"

        // The name for the application
        resValue "string", "appName", twaManifest.name

        // The name for the application on the Android Launcher
        resValue "string", "launcherName", twaManifest.launcherName

        // The URL that will be used when launching the TWA from the Android Launcher
        def launchUrl = "https://" + twaManifest.hostName + twaManifest.launchUrl
        resValue "string", "launchUrl", launchUrl

        

        
            // The URL the Web Manifest for the Progressive Web App that the TWA points to. This
            // is used by Chrome OS and Meta Quest to open the Web version of the PWA instead of
            // the TWA, as it will probably give a better user experience for non-mobile devices.
            resValue "string", "webManifestUrl", 'https://walletlens.live/manifest.webmanifest'
        

        
            // This is used by Meta Quest.
            resValue "string", "fullScopeUrl", 'https://walletlens.live/'
        

        

        // The hostname is used when building the intent-filter, so the TWA is able to
        // handle Intents to open host url of the application.
        resValue "string", "hostName", twaManifest.hostName

        // This attribute sets the status bar color for the TWA. It can be either set here or in
        // `res/values/colors.xml`. Setting in both places is an error and the app will not
        // compile. If not set, the status bar color defaults to #FFFFFF - white.
        resValue "color", "colorPrimary", twaManifest.themeColor

        // This attribute sets the dark status bar color for the TWA. It can be either set here or in
        // `res/values/colors.xml`. Setting in both places is an error and the app will not
        // compile. If not set, the status bar color defaults to #000000 - white.
        resValue "color", "colorPrimaryDark", twaManifest.themeColorDark

        // This attribute sets the navigation bar color for the TWA. It can be either set here or in
        // `res/values/colors.xml`. Setting in both places is an error and the app will not
        // compile. If not set, the navigation bar color defaults to #FFFFFF - white.
        resValue "color", "navigationColor", twaManifest.navigationColor

        // This attribute sets the dark navigation bar color for the TWA. It can be either set here
        // or in `res/values/colors.xml`. Setting in both places is an error and the app will not
        // compile. If not set, the navigation bar color defaults to #000000 - black.
        resValue "color", "navigationColorDark", twaManifest.navigationColorDark

        // This attribute sets the navbar divider color for the TWA. It can be either 
        // set here or in `res/values/colors.xml`. Setting in both places is an error and the app 
        // will not compile. If not set, the divider color defaults to #00000000 - transparent.
        resValue "color", "navigationDividerColor", twaManifest.navigationDividerColor

        // This attribute sets the dark navbar divider color for the TWA. It can be either 
        // set here or in `res/values/colors.xml`. Setting in both places is an error and the 
        //app will not compile. If not set, the divider color defaults to #000000 - black.
        resValue "color", "navigationDividerColorDark", twaManifest.navigationDividerColorDark

        // Sets the color for the background used for the splash screen when launching the
        // Trusted Web Activity.
        resValue "color", "backgroundColor", twaManifest.backgroundColor

        // Defines a provider authority for the Splash Screen
        resValue "string", "providerAuthority", twaManifest.applicationId + '.fileprovider'

        // The enableNotification resource is used to enable or disable the
        // TrustedWebActivityService, by changing the android:enabled and android:exported
        // attributes
        resValue "bool", "enableNotification", twaManifest.enableNotifications.toString()

        twaManifest.shortcuts.eachWithIndex { shortcut, index ->
            resValue "string", "shortcut_name_$index", "$shortcut.name"
            resValue "string", "shortcut_short_name_$index", "$shortcut.short_name"
        }

        // The splashScreenFadeOutDuration resource is used to set the duration of fade out animation in milliseconds
        // to be played when removing splash screen. The default is 0 (no animation).
        resValue "integer", "splashScreenFadeOutDuration", twaManifest.splashScreenFadeOutDuration.toString()

        resValue "string", "generatorApp", twaManifest.generatorApp

        resValue "string", "fallbackType", twaManifest.fallbackType

        resValue "bool", "enableSiteSettingsShortcut", twaManifest.enableSiteSettingsShortcut
        resValue "string", "orientation", twaManifest.orientation

        
    }
    buildFeatures {
        // AGP 9 turns resValue support off by default. This project generates
        // nearly all of its resources that way — launchUrl, every theme colour,
        // the shortcut labels, enableNotification — so it has to be switched
        // back on or configuration fails with "defaultConfig contains custom
        // resource values, but the feature is disabled".
        resValues = true
    }
    signingConfigs {
        // Created only when all four values are present. An empty signing
        // config is worse than none: AGP would attach it and then fail deep
        // inside the packaging task with a null store file.
        if (wlHasLocalSigning) {
            release {
                storeFile file(wlKeystoreFile)
                storePassword wlKeystorePassword
                keyAlias wlKeyAlias
                keyPassword wlKeyPassword
                // v1 as well as v2/v3. minSdk is 23, so v2 alone would be
                // enough for Android itself, but several third-party store
                // validators still read only the v1 JAR signature and report
                // a v2-only APK as unsigned.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            // R8 is ON, with the keep rules genuinely applied.
            //
            // ── The history, because it is the reason for every choice here ──
            //
            // 6ff0b43 dropped the proguardFiles line but left minifyEnabled
            // true. That combination is worse than either extreme: R8 kept
            // shrinking AND obfuscating, with none of the rules in
            // proguard-rules.pro applied. Every build from v2.8 onward shipped
            // renamed classes with nothing protecting what Android resolves by
            // name — and, because -keepattributes SourceFile,LineNumberTable
            // lives in that same unapplied file, with stack traces that had no
            // line numbers, which is most of why the resulting crash was so
            // hard to place.
            //
            // Minification was then turned off outright as a bisect step. That
            // answered the question and has been the state ever since, at the
            // cost of roughly a megabyte and of shipping unoptimised code.
            //
            // ── Why it is back on now ────────────────────────────────────────
            //
            // Play's new quality bar names code optimization explicitly, and
            // the mapping file R8 produces is what makes a Play Console stack
            // trace readable — the build's "Upload ProGuard mapping" step has
            // been finding no file to upload this whole time.
            //
            // The difference from the build that crashed is that proguardFiles
            // is present, so proguard-rules.pro is actually applied. Those
            // rules cover exactly what R8 cannot see: WorkManager instantiating
            // a worker from a class name in its database, androidbrowserhelper
            // reading class names out of manifest meta-data, the Play review
            // library's callbacks crossing a binder boundary.
            //
            // ── Optimisation and resource shrinking, now on ──────────────────
            //
            // These were the two things this comment used to say were
            // deliberately off, and the reason was sound: both were among four
            // untested changes that landed together before the v2.7 launch
            // crash, and turning three things on at once is how that became
            // impossible to diagnose.
            //
            // They are on because Play's release dashboard asks for them, and
            // the ground is firmer than it was:
            //
            //   • proguard-rules.pro has since gained explicit rules for the
            //     JavaScript bridge and for Play In-App Update. The bridge rule
            //     duplicates one in AGP's default config on purpose; the update
            //     one was simply MISSING, and optimisation is what would have
            //     turned that from latent into a silent failure.
            //   • TopMoversWidgetProvider no longer resolves its views with
            //     Resources.getIdentifier, which R8 cannot see through — that
            //     was the sharpest edge shrinkResources had to survive.
            //   • keep.xml still protects the resources that ARE resolved by
            //     name, and shrinkMode stays "safe" rather than "strict", so
            //     the shrinker keeps its conservative heuristic as well as the
            //     explicit list.
            //
            // ── If this release crashes on launch ────────────────────────────
            //
            // These are two changes, not one, and they fail differently. A
            // ClassNotFoundException, a NoSuchMethodError, or a bridge call
            // that does nothing is the OPTIMISER: revert the proguardFiles line
            // to 'proguard-android.txt'. A missing icon, an empty widget, or a
            // Resources.NotFoundException is the RESOURCE SHRINKER: set
            // shrinkResources back to false. Changing both back at once tells
            // you nothing, which is the lesson from v2.7.
            //
            // This build is not for Play until it has opened on a device. The
            // failure mode of getting a keep rule wrong is a launch crash, and
            // no test here can catch it.
            // ALL OF R8 OFF, after 6.15 failed to launch.
            //
            // 6.15 carried four unvalidated toolchain changes at once — the TWA
            // removal, R8 optimisation, resource shrinking and AGP 9 — because
            // 6.12 through 6.14 were built and never installed. It crashed on
            // first open, and nothing in that stack can be blamed over another
            // from a single data point.
            //
            // So this is not a bisect step, it is a floor: no optimising, no
            // shrinking, no renaming. minifyEnabled goes off as well as the
            // rest, because the earlier v2.8 bisect established that turning
            // OPTIMISATION off is not the same as turning R8 off — shrinking
            // and renaming continued and it still crashed. Leaving it on here
            // would repeat that mistake and produce another ambiguous result.
            //
            // What that buys is a decisive next reading. If this build opens,
            // the fault is in the toolchain and the pieces go back one at a
            // time with a device check between each. If it still crashes, the
            // fault is in the Java or the manifest and R8 was never involved.
            // Left unset when no credentials are configured, so the guard
            // at the bottom of this file is what reports the problem.
            if (wlHasLocalSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint {
        checkReleaseBuilds = false
    }
}

task generateShorcutsFile {
    assert twaManifest.shortcuts.size() < 5, "You can have at most 4 shortcuts."
    twaManifest.shortcuts.eachWithIndex { s, i ->
        assert s.name != null, 'Missing `name` in shortcut #' + i
        assert s.short_name != null, 'Missing `short_name` in shortcut #' + i
        assert s.url != null, 'Missing `icon` in shortcut #' + i
        assert s.icon != null, 'Missing `url` in shortcut #' + i
    }

    def shortcutsFile = new File("$projectDir/src/main/res/xml", "shortcuts.xml")

    def xmlWriter = new StringWriter()
    def xmlMarkup = new MarkupBuilder(new IndentPrinter(xmlWriter, "    ", true))

    xmlMarkup
        .'shortcuts'('xmlns:android': 'http://schemas.android.com/apk/res/android') {
            twaManifest.shortcuts.eachWithIndex { s, i ->
                'shortcut'(
                        'android:shortcutId': 'shortcut' + i,
                        'android:enabled': 'true',
                        'android:icon': '@drawable/' + s.icon,
                        'android:shortcutShortLabel': '@string/shortcut_short_name_' + i,
                        'android:shortcutLongLabel': '@string/shortcut_name_' + i) {
                    'intent'(
                            'android:action': 'android.intent.action.MAIN',
                            'android:targetPackage': twaManifest.applicationId,
                            // AppShellActivity, not LauncherActivity. A long-press
                            // shortcut is a launcher entry like any other, and one
                            // that still targeted the TWA would open Chrome from an
                            // app that no longer uses it — the address bar back on
                            // the one path nobody thinks to retest.
                            'android:targetClass': twaManifest.applicationId + '.AppShellActivity',
                            'android:data': s.url)
                    'categories'('android:name': 'android.intent.category.LAUNCHER')
                }
            }
        }
    shortcutsFile.text = xmlWriter.toString() + '\n'
}

preBuild.dependsOn(generateShorcutsFile)

repositories {
    
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')


    implementation "androidx.work:work-runtime:2.10.0"
    implementation "androidx.biometric:biometric:1.2.0-alpha05"
    implementation "androidx.appcompat:appcompat:1.7.0"

    // Custom Tabs. This used to arrive transitively through
    // androidbrowserhelper as well; that library is gone, so this declaration
    // is now the only thing providing it. The WebView shell needs it directly:
    // Google refuses OAuth in a WebView, so the Drive sign-in has to leave for
    // a real browser tab, and the one-time handoff out of Chrome uses it too.
    implementation "androidx.browser:browser:1.8.0"

    // QR code generation for export
    implementation 'com.google.zxing:core:3.5.3'

    // Google Play In-App Review — shows the native rating card inside the app
    // instead of throwing the user out to the Play listing.
    implementation 'com.google.android.play:review:2.0.2'

    // Google Play In-App Updates — tells the user a new version is out.
    //
    // The app is a shell around a web app, so most changes ship the moment
    // Cloudflare Pages deploys and nobody has to do anything. Native changes do
    // not: notification channels, the vault, the file pickers, the biometric
    // prompt all live in this APK, and an install left on an old code keeps the
    // old behaviour for ever, because Play's own auto-update is off or
    // Wi-Fi-only for a great many people. This asks Play whether a newer
    // version code is live and, if it is, says so in the app.
    implementation 'com.google.android.play:app-update:2.1.0'

    // Firebase Cloud Messaging.
    //
    // The transport the notification channels need once the app renders itself
    // in a WebView: a WebView has no service worker, so the Web Push
    // subscription the server has addressed since the Deno service does not
    // exist there. Everything ABOVE the transport — every channel, threshold
    // and cooldown in workers/push/jobs.js — is unchanged by this.
    //
    // The BoM pins one mutually-tested set of Firebase versions, so the
    // messaging artifact carries no version of its own.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}

// Fail a release packaging task that has no signing configured either way,
// rather than writing app-release-unsigned.apk and leaving it to be noticed by
// a store's upload check days later.
//
// Scoped to the packaging tasks on purpose: android-compile.yml runs only
// :app:compileReleaseJavaWithJavac, which needs no key and must keep working
// without one.
gradle.taskGraph.whenReady { graph ->
    if (wlHasLocalSigning || wlHasInjectedSigning) {
        return
    }
    def signed = graph.allTasks.any { t ->
        t.path.startsWith(':app:') && t.name ==~ /^(assemble|bundle|package)Release$/
    }
    if (signed) {
        throw new GradleException(
            "No release signing configured, so this build would produce an " +
            "UNSIGNED artifact that installs nowhere.\n\n" +
            "Set these in ~/.gradle/gradle.properties (never in the repo):\n" +
            "  WL_KEYSTORE_FILE=/absolute/path/to/upload.keystore\n" +
            "  WL_KEYSTORE_PASSWORD=...\n" +
            "  WL_KEY_ALIAS=...\n" +
            "  WL_KEY_PASSWORD=...\n\n" +
            "Or pass -Pandroid.injected.signing.store.file=... the way " +
            ".github/workflows/build-aab.yml does.\n\n" +
            "Remember this is the UPLOAD key. For a third-party store, " +
            "download the signed universal APK from the Play Console instead."
        )
    }
}
