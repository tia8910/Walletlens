# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
android.useAndroidX=true

# Optimized resource shrinking — still off, and now it is doing something.
#
# It lets R8 shrink the resource TABLE and inline constant lookups, a step
# beyond the plain shrinkResources that is now on (see app/build.gradle). Two
# things changed under this line and neither argues for turning it on yet:
#
#   • shrinkResources is true as of 6.13, so this no longer sits inert behind
#     a disabled feature — it is actively holding a step back.
#   • AGP 9 makes it the DEFAULT, so this explicit false is now an override
#     rather than a restatement.
#
# Which is exactly why it stays. 6.13 and 6.14 already carry the two changes
# from the v2.7 bisect that have never been cleared on a device; adding a third
# in the same pair of releases rebuilds the combination that made that crash
# impossible to diagnose. It is one line, and it can go on once a build with
# these two has opened on a phone.
android.r8.optimizedResourceShrinking=false
