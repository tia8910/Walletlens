# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
android.useAndroidX=true

# Optimized resource shrinking — DISABLED while the v2.7 launch crash is being
# bisected. It lets R8 shrink the resource *table* and inline constant lookups,
# which is the "Optimized resource shrinking isn't enabled" item Play reports
# against release 42, but it is also one of four untested changes sitting
# between the crashing build and the release Play currently serves.
#
# It has no effect anyway while shrinkResources is false (see app/build.gradle);
# setting it explicitly keeps the intent visible rather than leaving a stale
# true behind a disabled feature.
#
# Re-enable together with shrinkResources once a build boots on-device.
android.r8.optimizedResourceShrinking=false
